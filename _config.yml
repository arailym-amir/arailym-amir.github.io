# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Arailym Amir
description: "Hi, I'm Arailym, a Data Analyst and 2026 CS grad. This portfolio is a work in progress, much like my data science journey! Here you'll find projects I've recently worked on, with more on the way. Feel free to visit my GitHub and LinkedIn pages, or download my resume, below!"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Data Science <span style="color:#f58506"> Portfolio </span>
location: "Seattle, WA, United States"
resume_url: /img/posts/Arailym_Amir_Resume.pdf
avatar_image: /img/profile.jpg

#-------------------------------
# Contact links
linkedln: "https://www.linkedin.com/in/arailym-amir/" # Add your linkedln handle
github: "https://github.com/arailym-amir"  # Add your github handle

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


